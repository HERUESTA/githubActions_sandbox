# Dependabot が作成した PR に対してレビュー依頼コメントを投稿するワークフロー
name: Review

on:
  pull_request:
    types: [labeled]
  issues: 
    types: [labeled]
defaults:
  run:
    shell: bash

jobs:
  review:
    if: contains(fromJSON('["review", "ruby"]'), github.event.label.name)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # GitHub App トークンの生成
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
        with:
          app-id: ${{ vars.GH_APP_CLUADE_COMMENT_ID }}
          private-key: ${{ secrets.GH_CLOUDE_COMMENT_PRIVATE_KEY }}

      # review ラベル: @claude /review を投稿
      - name: Post review comment
        if: github.event.label.name == 'review'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "@claude /review"
            gh pr edit ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --add-reviewer "@copilot"
          else
            gh issue comment ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --body "@claude /review"
          fi

      # ruby ラベル: @claude /ruby を投稿
      - name: Post ruby comment
        if: github.event.label.name == 'ruby'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "@claude /ruby"
          else
            gh issue comment ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --body "@claude /ruby"
          fi
